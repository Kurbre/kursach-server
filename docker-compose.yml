services:
  db_kursach:
    image: postgres:15
    container_name: db_kursach
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - db_kursach:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis_kursach:
    image: redis:7-alpine
    container_name: redis_kursach
    environment:
      - TZ=Europe/Kyiv
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_kursach_data:/data

volumes:
  db_kursach:
  redis_kursach_data:
